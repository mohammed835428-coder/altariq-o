<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطارق التفاعلية — أ/ محمد أشرف</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --secondary: #0f172a;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

        /* الهيدر العلوي */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3);
        }

        .brand-text h1 { font-size: 1.25rem; font-weight: 800; color: var(--primary-dark); line-height: 1.2; }
        .brand-text span { font-size: 0.85rem; color: var(--muted); font-weight: 700; }

        .nav-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn {
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .nav-btn-outline { border-color: var(--primary); color: var(--primary); background: transparent; }
        .nav-btn-outline:hover, .nav-btn-outline.active { background: var(--primary); color: white; }
        .nav-btn-teacher { background: var(--secondary); color: white; }
        .nav-btn-teacher:hover { background: #334155; }

        /* البانر الترحيبي */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1d4ed8 100%);
            color: white;
            padding: 3rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero h2 { font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem; }
        .hero p { color: #cbd5e1; font-size: 1.05rem; max-width: 680px; margin: 0 auto; }

        /* شريط التنبيهات العاجلة */
        .announcement-bar {
            background: linear-gradient(90deg, #f59e0b, #d97706);
            color: #0f172a;
            padding: 0.75rem 1.5rem;
            text-align: center;
            font-weight: 800;
            font-size: 0.95rem;
            display: none;
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
        }

        /* الحاوية والبطاقات */
        .container { max-width: 1150px; margin: 2rem auto; padding: 0 1rem; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .card-header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-header h3 { color: var(--primary-dark); font-size: 1.35rem; font-weight: 800; }
        .card-header p { color: var(--muted); font-size: 0.9rem; }

        /* النماذج وحقول الإدخال */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .form-group { margin-bottom: 1.1rem; }
        label { display: block; font-weight: 700; margin-bottom: 0.4rem; font-size: 0.92rem; color: var(--secondary); }
        input, select, textarea {
            width: 100%;
            padding: 0.78rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1); }

        .pass-wrapper { position: relative; }
        .toggle-pass {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--muted);
        }

        /* الأزرار */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-block { width: 100%; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .btn-sm { padding: 0.45rem 0.85rem; font-size: 0.82rem; border-radius: 8px; }

        /* تبويبات */
        .auth-tabs, .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .auth-tab, .admin-tab {
            flex: 1;
            min-width: 120px;
            padding: 0.7rem;
            text-align: center;
            border-radius: 9px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--muted);
            transition: 0.2s;
        }

        .auth-tab.active, .admin-tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* شريط التقدم للطالب */
        .progress-container {
            background: #e2e8f0;
            border-radius: 20px;
            height: 14px;
            width: 100%;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            background: linear-gradient(90deg, var(--success), #34d399);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* بطاقات الكورسات التفاعلية */
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.4rem; }
        .course-box {
            border: 1.5px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .course-box:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08); }
        .course-box.completed { border-color: var(--success); }

        .course-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 1.2rem;
            position: relative;
        }
        .course-header h4 { font-size: 1.15rem; font-weight: 800; }
        .course-badge {
            font-size: 0.78rem;
            background: var(--accent);
            color: #0f172a;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 800;
            display: inline-block;
            margin-top: 6px;
        }
        .done-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--success);
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 800;
        }

        .course-body { padding: 1.2rem; color: var(--text); font-size: 0.94rem; flex-grow: 1; }
